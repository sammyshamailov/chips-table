[build]
  # Vite builds the app into dist/, then config.js (Firebase settings and APP_BUILD) is written next to index.html.
  publish = "dist"
  command = "npm run build && node scripts/build-config.js dist"

[build.environment]
  NODE_VERSION = "22"
  # The Firebase web config ends up in the browser by design, so Netlify's secret scan should not block it.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY,FIREBASE_PROJECT_ID,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,FIREBASE_AUTH_DOMAIN,FIREBASE_STORAGE_BUCKET"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed file names change whenever their content does, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
